name: Telegram Tennis Alerts

on:
  workflow_dispatch: # Запуск по API от cron-job.org

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Bot Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PINNAPI_API_KEY: ${{ secrets.PINNAPI_API_KEY }}
        run: python telegram_bot.py

      - name: Commit sent matches
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sent_matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent matches" && git push)
