name: Telegram Tennis Alerts

on:
  schedule:
    - cron: '0 */6 * * *' # Каждые 6 часов
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 5 часов 50 минут. GitHub убьет процесс, если он зависнет
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install pyTelegramBotAPI requests
        
      - name: Run Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          PINNAPI_API_KEY: ${{ secrets.PINNAPI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          THREAD_ID_NOTIFICATIONS: ${{ secrets.THREAD_ID_NOTIFICATIONS }}
          THREAD_ID_MY_BETS: ${{ secrets.THREAD_ID_MY_BETS }}
          THREAD_ID_STATS: ${{ secrets.THREAD_ID_STATS }}
        run: python telegram_bot.py
        
      - name: Commit sent matches
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sent_matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent matches [skip ci]" && git pull --rebase && git push)
